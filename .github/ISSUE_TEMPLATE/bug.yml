name: Report a problem
description: Report an installation problem, unclear instruction, or poor output.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What went wrong?
      description: Describe the expected and actual behavior. Remove private data.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: Include the prompt, a public or fictional project brief, and relevant output or images.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Host and version
      description: For example, Codex version, OS, skill tag, and available visual tools. Do not include credentials.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I removed secrets and private project content from this report.
          required: true
