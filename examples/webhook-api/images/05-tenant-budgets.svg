<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="880" viewBox="0 0 1400 880" role="img" aria-labelledby="title desc">
<title id="title">Keep one tenant&#x27;s burst from blocking others</title>
<desc id="desc">Concept • Allocate bounded delivery capacity per tenant with visible queue and quota feedback. Ordering remains unspecified. Fairness applies to runnable work, not slow external responses. At backlog cap, reject new ingestion with 429 and a documented retry policy; never silently drop. Lease expiry recovers crashed workers; receiver idempotency still handles duplicate attempts.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#2262C6"/></marker></defs>
<rect width="1400" height="880" fill="#F7F5EF"/>
<g font-family="Arial, Helvetica, sans-serif">
