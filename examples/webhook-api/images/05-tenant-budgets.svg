<text x="966" y="446" font-size="20" font-weight="400" fill="#152A3A">No cross-tenant event access</text>
<text x="56" y="544" font-size="16" font-weight="700" fill="#2262C6">WHAT CHANGES</text>
<text x="56" y="586" font-size="24" font-weight="700" fill="#152A3A">acme burst</text>
<text x="56" y="621" font-size="20" font-weight="400" fill="#152A3A">Bounded queue + concurrency</text>
