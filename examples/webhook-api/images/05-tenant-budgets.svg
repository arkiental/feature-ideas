<text x="78" y="335" font-size="20" font-weight="400" fill="#152A3A">acme: 10,000 queued events</text>
<text x="78" y="372" font-size="20" font-weight="400" fill="#152A3A">birch: 2 queued events</text>
<text x="78" y="409" font-size="20" font-weight="400" fill="#152A3A">acme in-flight limit: 10</text>
<text x="78" y="446" font-size="20" font-weight="400" fill="#152A3A">birch in-flight limit: 10</text>
<path d="M464 351 H491" fill="none" stroke="#2262C6" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="500" y="212" width="400" height="279" fill="#FFFFFF" stroke="#B4BFCA"/>
<text x="522" y="247" font-size="16" font-weight="700" fill="#2262C6">2 / MECHANISM</text>
<text x="522" y="288" font-size="25" font-weight="700" fill="#152A3A">Schedule fair turns</text>
<text x="522" y="335" font-size="20" font-weight="400" fill="#152A3A">Per-tenant ready queues</text>
<text x="522" y="372" font-size="20" font-weight="400" fill="#152A3A">Shared worker pool</text>
<text x="522" y="409" font-size="20" font-weight="400" fill="#152A3A">Atomic in-flight leases</text>
<text x="522" y="446" font-size="20" font-weight="400" fill="#152A3A">Per-tenant backlog cap</text>
<path d="M908 351 H935" fill="none" stroke="#2262C6" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="944" y="212" width="400" height="279" fill="#FFFFFF" stroke="#B4BFCA"/>
<text x="966" y="247" font-size="16" font-weight="700" fill="#2262C6">3 / RESULT</text>
<text x="966" y="288" font-size="25" font-weight="700" fill="#152A3A">Both tenants progress</text>
<text x="966" y="335" font-size="20" font-weight="400" fill="#152A3A">birch gets eligible turns</text>
<text x="966" y="372" font-size="20" font-weight="400" fill="#152A3A">acme continues draining</text>
