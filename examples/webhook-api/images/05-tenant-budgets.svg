<text x="56" y="109" font-size="37" font-weight="700" fill="#152A3A">Keep one tenant&#x27;s burst from blocking others</text>
<text x="56" y="150" font-size="21" font-weight="400" fill="#152A3A">Concept • Allocate bounded delivery capacity per tenant with visible queue and quota feedback.</text>
