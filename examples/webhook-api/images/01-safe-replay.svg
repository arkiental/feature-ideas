<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="880" viewBox="0 0 1400 880" role="img" aria-labelledby="title desc">
<title id="title">Safe replay after an endpoint outage</title>
<desc id="desc">Concept • Retry a selected failed delivery without creating an accidental second job. A repeated request returns the existing replay job; it does not enqueue a second one. A successful delivery can still be received more than once: the receiver must deduplicate evt_104. Expired payload → 410 payload_expired; no empty replay job is created.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#2262C6"/></marker></defs>
<rect width="1400" height="880" fill="#F7F5EF"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="56" y="55" font-size="16" font-weight="700" fill="#2262C6">RELAYBOX / ILLUSTRATED FEATURE IDEAS</text>
<text x="56" y="109" font-size="37" font-weight="700" fill="#152A3A">Safe replay after an endpoint outage</text>
<text x="56" y="150" font-size="21" font-weight="400" fill="#152A3A">Concept • Retry a selected failed delivery without creating an accidental second job.</text>
<line x1="56" y1="179" x2="1344" y2="179" stroke="#B4BFCA"/>
<rect x="56" y="212" width="400" height="279" fill="#FFFFFF" stroke="#B4BFCA"/>
<text x="78" y="247" font-size="16" font-weight="700" fill="#2262C6">1 / TRIGGER</text>
<text x="78" y="288" font-size="25" font-weight="700" fill="#152A3A">Developer selects failure</text>
<text x="78" y="335" font-size="20" font-weight="400" fill="#152A3A">evt_104 → ep_billing</text>
<text x="78" y="372" font-size="20" font-weight="400" fill="#152A3A">Last response: 503</text>
<text x="78" y="409" font-size="20" font-weight="400" fill="#152A3A">POST /deliveries/dlv_82/replays</text>
<text x="78" y="446" font-size="20" font-weight="400" fill="#152A3A">Idempotency-Key: repair-82</text>
<path d="M464 351 H491" fill="none" stroke="#2262C6" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="500" y="212" width="400" height="279" fill="#FFFFFF" stroke="#B4BFCA"/>
<text x="522" y="247" font-size="16" font-weight="700" fill="#2262C6">2 / MECHANISM</text>
<text x="522" y="288" font-size="25" font-weight="700" fill="#152A3A">Create one replay job</text>
<text x="522" y="335" font-size="20" font-weight="400" fill="#152A3A">Check tenant + retention</text>
<text x="522" y="372" font-size="20" font-weight="400" fill="#152A3A">Reserve key atomically</text>
<text x="522" y="409" font-size="20" font-weight="400" fill="#152A3A">Copy original event body</text>
<text x="522" y="446" font-size="20" font-weight="400" fill="#152A3A">New delivery: dlv_83</text>
<path d="M908 351 H935" fill="none" stroke="#2262C6" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="944" y="212" width="400" height="279" fill="#FFFFFF" stroke="#B4BFCA"/>
<text x="966" y="247" font-size="16" font-weight="700" fill="#2262C6">3 / RESULT</text>
<text x="966" y="288" font-size="25" font-weight="700" fill="#152A3A">Trace the recovery</text>
<text x="966" y="335" font-size="20" font-weight="400" fill="#152A3A">202 Accepted → dlv_83</text>
<text x="966" y="372" font-size="20" font-weight="400" fill="#152A3A">Repeat key → same job</text>
<text x="966" y="409" font-size="20" font-weight="400" fill="#152A3A">Delivery response: 204</text>
<text x="966" y="446" font-size="20" font-weight="400" fill="#152A3A">Replay-of: dlv_82</text>
<text x="56" y="544" font-size="16" font-weight="700" fill="#2262C6">WHAT CHANGES</text>
<text x="56" y="586" font-size="24" font-weight="700" fill="#152A3A">Original attempt</text>
<text x="56" y="621" font-size="20" font-weight="400" fill="#152A3A">dlv_82 · 503</text>
<path d="M421 580 H481" fill="none" stroke="#2262C6" stroke-width="2" marker-end="url(#arrow)"/>
<text x="500" y="586" font-size="24" font-weight="700" fill="#152A3A">One replay job</text>
<text x="500" y="621" font-size="20" font-weight="400" fill="#152A3A">dlv_83 · queued</text>
<path d="M865 580 H925" fill="none" stroke="#2262C6" stroke-width="2" marker-end="url(#arrow)"/>
<text x="944" y="586" font-size="24" font-weight="700" fill="#152A3A">Receiver succeeds</text>
<text x="944" y="621" font-size="20" font-weight="400" fill="#152A3A">dlv_83 · 204</text>
<line x1="56" y1="658" x2="1344" y2="658" stroke="#B4BFCA"/>
<text x="56" y="703" font-size="18" font-weight="700" fill="#2262C6">01</text>
<text x="98" y="703" font-size="19" font-weight="400" fill="#152A3A">A repeated request returns the existing replay job; it does not enqueue a second one.</text>
<text x="56" y="750" font-size="18" font-weight="700" fill="#2262C6">02</text>
<text x="98" y="750" font-size="19" font-weight="400" fill="#152A3A">A successful delivery can still be received more than once: the receiver must deduplicate evt_104.</text>
<text x="56" y="797" font-size="18" font-weight="700" fill="#2262C6">03</text>
<text x="98" y="797" font-size="19" font-weight="400" fill="#152A3A">Expired payload → 410 payload_expired; no empty replay job is created.</text>
<text x="56" y="850" font-size="15" font-weight="400" fill="#526675">Fictional project • Synthetic data • Proposed behavior, not a shipped feature or measured result</text>
</g></svg>