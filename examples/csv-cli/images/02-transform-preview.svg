<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">See a transformation before saving it</title><desc id="desc">02 · Dry-run preview · Tablecraft concept. Fictional commands and illustrative output. Outcome: check a bounded sample before running the full transform.</desc><rect width="1200" height="760" fill="#F6F4EB"/><text x="48" y="48" font-family="Arial, sans-serif" font-size="19" fill="#346354" font-weight="700">02 · Dry-run preview · Tablecraft concept</text><text x="48" y="99" font-family="Arial, sans-serif" font-size="36" fill="#142D3A" font-weight="700">See a transformation before saving it</text><text x="48" y="133" font-family="Arial, sans-serif" font-size="18" fill="#53686D" >Fictional specification walkthrough · not a terminal capture</text><rect x="48" y="170" width="672" height="415" rx="14" fill="#142D3A"/><text x="72" y="204" font-family="Arial, sans-serif" font-size="14" fill="#ABCBC0" letter-spacing="1.3">PROPOSED COMMAND + ILLUSTRATIVE OUTPUT</text><text x="72" y="244" xml:space="preserve" font-family="Consolas, monospace" font-size="20" fill="#A8E8C4">$ tablecraft derive orders.csv</text><text x="72" y="272" xml:space="preserve" font-family="Consolas, monospace" font-size="20" fill="#A8E8C4">    total=&quot;price * qty&quot; --preview 5</text><text x="72" y="325" xml:space="preserve" font-family="Consolas, monospace" font-size="21" fill="#E7F0EE">INPUT                   PROPOSED</text><text x="72" y="353" xml:space="preserve" font-family="Consolas, monospace" font-size="21" fill="#E7F0EE">sku    price   qty       total</text><text x="72" y="381" xml:space="preserve" font-family="Consolas, monospace" font-size="21" fill="#E7F0EE">A-104  12.50    2         25.00</text><text x="72" y="409" xml:space="preserve" font-family="Consolas, monospace" font-size="21" fill="#E7F0EE">B-208   8.00    3         24.00</text><text x="72" y="437" xml:space="preserve" font-family="Consolas, monospace" font-size="21" fill="#E7F0EE"></text><text x="72" y="465" xml:space="preserve" font-family="Consolas, monospace" font-size="21" fill="#E7F0EE">2 of 2 rows previewed</text><text x="72" y="493" xml:space="preserve" font-family="Consolas, monospace" font-size="21" fill="#E7F0EE">No output file written</text><rect x="748" y="170" width="404" height="126" rx="10" fill="#E7ECE1"/><circle cx="778" cy="200" r="15" fill="#24674F"/><text x="778" y="206" font-family="Arial, sans-serif" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="700">1</text><text x="806" y="207" font-family="Arial, sans-serif" font-size="22" fill="#142D3A" font-weight="700">Use the same evaluator</text><text x="774" y="242" font-family="Arial, sans-serif" font-size="21" fill="#142D3A" >Preview and derive share</text><text x="774" y="272" font-family="Arial, sans-serif" font-size="21" fill="#142D3A" >expression and decimal rules.</text><rect x="748" y="310" width="404" height="126" rx="10" fill="#E7ECE1"/><circle cx="778" cy="340" r="15" fill="#24674F"/><text x="778" y="346" font-family="Arial, sans-serif" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="700">2</text><text x="806" y="347" font-family="Arial, sans-serif" font-size="22" fill="#142D3A" font-weight="700">Compare the result</text><text x="774" y="382" font-family="Arial, sans-serif" font-size="21" fill="#142D3A" >Align source and new values.</text><text x="774" y="412" font-family="Arial, sans-serif" font-size="21" fill="#142D3A" >Limit the sample to 5 rows.</text><rect x="748" y="450" width="404" height="126" rx="10" fill="#E7ECE1"/><circle cx="778" cy="480" r="15" fill="#24674F"/><text x="778" y="486" font-family="Arial, sans-serif" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="700">3</text><text x="806" y="487" font-family="Arial, sans-serif" font-size="22" fill="#142D3A" font-weight="700">Save with an explicit path</text><text x="774" y="522" font-family="Arial, sans-serif" font-size="21" fill="#142D3A" >Remove --preview and add</text><text x="774" y="552" font-family="Arial, sans-serif" font-size="21" fill="#142D3A" >--output enriched.csv.</text><rect x="48" y="618" width="1104" height="77" rx="10" fill="#D6E8D8"/><text x="72" y="664" font-family="Arial, sans-serif" font-size="23" fill="#174B38" font-weight="700">Outcome: check a bounded sample before running the full transform.</text><text x="48" y="732" font-family="Arial, sans-serif" font-size="14" fill="#53686D" letter-spacing="1.5">FEATURE IDEAS / TABLECRAFT</text><text x="1152" y="732" font-family="Arial, sans-serif" font-size="14" fill="#53686D" text-anchor="end" letter-spacing="1.2">CONCEPT · SYNTHETIC DATA</text></svg>
