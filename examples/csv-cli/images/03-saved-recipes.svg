<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Repeat a workflow without rebuilding it</title><desc id="desc">03 · Saved recipes · Tablecraft concept. Fictional commands and illustrative output. Outcome: teammates run the same declared steps with new input files.</desc><rect width="1200" height="760" fill="#F6F4EB"/><text x="48" y="48" font-family="Arial, sans-serif" font-size="19" fill="#346354" font-weight="700">03 · Saved recipes · Tablecraft concept</text><text x="48" y="99" font-family="Arial, sans-serif" font-size="36" fill="#142D3A" font-weight="700">Repeat a workflow without rebuilding it</text><text x="48" y="133" font-family="Arial, sans-serif" font-size="18" fill="#53686D" >Fictional specification walkthrough · not a terminal capture</text><rect x="48" y="170" width="672" height="415" rx="14" fill="#142D3A"/><text x="72" y="204" font-family="Arial, sans-serif" font-size="14" fill="#ABCBC0" letter-spacing="1.3">PROPOSED COMMAND + ILLUSTRATIVE OUTPUT</text><text x="72" y="244" xml:space="preserve" font-family="Consolas, monospace" font-size="20" fill="#A8E8C4">$ tablecraft run monthly.json</text><text x="72" y="272" xml:space="preserve" font-family="Consolas, monospace" font-size="20" fill="#A8E8C4">    --input orders.csv</text><text x="72" y="300" xml:space="preserve" font-family="Consolas, monospace" font-size="20" fill="#A8E8C4">    --output report.csv</text><text x="72" y="353" xml:space="preserve" font-family="Consolas, monospace" font-size="21" fill="#E7F0EE">recipeVersion: 1</text><text x="72" y="381" xml:space="preserve" font-family="Consolas, monospace" font-size="21" fill="#E7F0EE">1  validate  orders.schema.json</text><text x="72" y="409" xml:space="preserve" font-family="Consolas, monospace" font-size="21" fill="#E7F0EE">2  derive    total = price * qty</text><text x="72" y="437" xml:space="preserve" font-family="Consolas, monospace" font-size="21" fill="#E7F0EE">3  select    sku, qty, total</text><text x="72" y="465" xml:space="preserve" font-family="Consolas, monospace" font-size="21" fill="#E7F0EE"></text><text x="72" y="493" xml:space="preserve" font-family="Consolas, monospace" font-size="21" fill="#E7F0EE">Source unchanged</text><text x="72" y="521" xml:space="preserve" font-family="Consolas, monospace" font-size="21" fill="#E7F0EE">Report written: report.csv</text><rect x="748" y="170" width="404" height="126" rx="10" fill="#E7ECE1"/><circle cx="778" cy="200" r="15" fill="#24674F"/><text x="778" y="206" font-family="Arial, sans-serif" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="700">1</text><text x="806" y="207" font-family="Arial, sans-serif" font-size="22" fill="#142D3A" font-weight="700">Commit the workflow</text><text x="774" y="242" font-family="Arial, sans-serif" font-size="21" fill="#142D3A" >Store an ordered recipe</text><text x="774" y="272" font-family="Arial, sans-serif" font-size="21" fill="#142D3A" >with a versioned format.</text><rect x="748" y="310" width="404" height="126" rx="10" fill="#E7ECE1"/><circle cx="778" cy="340" r="15" fill="#24674F"/><text x="778" y="346" font-family="Arial, sans-serif" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="700">2</text><text x="806" y="347" font-family="Arial, sans-serif" font-size="22" fill="#142D3A" font-weight="700">Validate before execution</text><text x="774" y="382" font-family="Arial, sans-serif" font-size="21" fill="#142D3A" >Check every step and path.</text><text x="774" y="412" font-family="Arial, sans-serif" font-size="21" fill="#142D3A" >Reject unknown operations.</text><rect x="748" y="450" width="404" height="126" rx="10" fill="#E7ECE1"/><circle cx="778" cy="480" r="15" fill="#24674F"/><text x="778" y="486" font-family="Arial, sans-serif" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="700">3</text><text x="806" y="487" font-family="Arial, sans-serif" font-size="22" fill="#142D3A" font-weight="700">Publish after success</text><text x="774" y="522" font-family="Arial, sans-serif" font-size="21" fill="#142D3A" >Use a temporary output.</text><text x="774" y="552" font-family="Arial, sans-serif" font-size="21" fill="#142D3A" >Keep an existing file intact.</text><rect x="48" y="618" width="1104" height="77" rx="10" fill="#D6E8D8"/><text x="72" y="664" font-family="Arial, sans-serif" font-size="23" fill="#174B38" font-weight="700">Outcome: teammates run the same declared steps with new input files.</text><text x="48" y="732" font-family="Arial, sans-serif" font-size="14" fill="#53686D" letter-spacing="1.5">FEATURE IDEAS / TABLECRAFT</text><text x="1152" y="732" font-family="Arial, sans-serif" font-size="14" fill="#53686D" text-anchor="end" letter-spacing="1.2">CONCEPT · SYNTHETIC DATA</text></svg>
